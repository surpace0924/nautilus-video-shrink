[project]
name = "nautilus-video-shrink"
version = "0.1.0"
description = "Shrink videos to a target file size from the Nautilus context menu"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
video-shrink = "video_shrink.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
video_shrink = ["presets.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
